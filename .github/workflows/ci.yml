name: CI_CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: |
          docker build -t events-api:latest . --platform linux/amd64

      - name: Run docker image
        run: |
          docker run -d --name  events-api -p 5000:5000 events-api:latest
          sleep 5
          curl -fsS http://localhost:5000/api/health
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
         pip install -r requirements.txt

      - name: Run test
        run: |
          pytest -v

      - name: Stop and remove container
        if: always()
        run: |
          docker stop events-api
          docker rm events-api
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}

      - name: Tag docker image
        run: |
          docker tag events-api:latest ${{secrets.DOCKER_USERNAME}}/events-api:latest
          docker tag events-api:latest ${{secrets.DOCKER_USERNAME}}/events-api:${{ github.sha }}

      - name: Push to docker hub
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/events-api:latest
          docker push ${{secrets.DOCKER_USERNAME}}/events-api:${{ github.sha }}

      - name: Trigger Render deployment
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for Render rollout
        run: sleep 30

      - name: Smoke test Render health endpoint
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${RENDER_BASE_URL}/api/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Render smoke test succeeded!"
              exit 0
            fi
            sleep 10
          done
          echo "Render smoke test failed: did not receive HTTP 200 in time."
          exit 1